<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-label="Contadores públicos do perfil GitHub de Dinicley Aguiar">
  <rect width="900" height="180" rx="18" fill="#0d1117"/>
  <rect x="1" y="1" width="898" height="178" rx="17" fill="none" stroke="#30363d"/>
  <g font-family="monospace" text-anchor="middle">
    <g transform="translate(150 0)">
      <text y="78" fill="#00e5ff" font-size="42" font-weight="700">0<animate attributeName="opacity" values="1;0;0" dur="1.8s" fill="freeze"/></text>
      <text y="78" fill="#00e5ff" font-size="42" font-weight="700" opacity="0">70<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.70;1" dur="1.8s" fill="freeze"/></text>
      <text y="112" fill="#8b949e" font-size="13">REPOSITÓRIOS PÚBLICOS</text>
    </g>
    <g transform="translate(450 0)">
      <text y="78" fill="#58a6ff" font-size="42" font-weight="700">0<animate attributeName="opacity" values="1;0;0" dur="2.2s" fill="freeze"/></text>
      <text y="78" fill="#58a6ff" font-size="42" font-weight="700" opacity="0">6<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.78;1" dur="2.2s" fill="freeze"/></text>
      <text y="112" fill="#8b949e" font-size="13">PROJETOS EM DESTAQUE</text>
    </g>
    <g transform="translate(750 0)">
      <text y="78" fill="#3fb950" font-size="42" font-weight="700">0<animate attributeName="opacity" values="1;0;0" dur="2.6s" fill="freeze"/></text>
      <text y="78" fill="#3fb950" font-size="42" font-weight="700" opacity="0">17<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.82;1" dur="2.6s" fill="freeze"/></text>
      <text y="112" fill="#8b949e" font-size="13">TECNOLOGIAS NO STACK</text>
    </g>
  </g>
  <text x="24" y="158" fill="#6e7681" font-family="monospace" font-size="11">public-profile.metrics()</text>
</svg>